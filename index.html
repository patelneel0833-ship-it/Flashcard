<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Recall</title>
<style>
:root{--bg:#0b0b14;--s:rgba(255,255,255,.07);--b:rgba(255,255,255,.14);--t:#f2f1ff;--m:#a7a6c4;--a:#8b7cff;--a2:#37e6c8;--bad:#ff5d7a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html[data-t=ocean]{--bg:#041a24;--t:#e8f8ff;--m:#9bbccc;--a:#3fb6ff;--a2:#6bffb8}
html[data-t=paper]{--bg:#f5f1e8;--s:rgba(0,0,0,.05);--b:rgba(0,0,0,.16);--t:#23201a;--m:#6a6455;--a:#b83c20;--a2:#1f6b5c;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--t);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto 0;height:260px;background:radial-gradient(60% 100% at 50% 0,var(--a),transparent);opacity:.18;pointer-events:none;z-index:-1}
main{max-width:640px;margin:0 auto;padding:14px 16px 60px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;min-height:44px}
:focus-visible{outline:3px solid var(--a2);outline-offset:2px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}
.logo{font-weight:800;font-size:1.4rem;letter-spacing:-.03em;background:linear-gradient(90deg,var(--a),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent}
.chip{background:var(--s);border:1px solid var(--b);border-radius:99px;padding:8px 14px;font-size:.88rem}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip.on{background:var(--a);color:#08080f;border-color:transparent;font-weight:700}
.glass label{display:block;margin:12px 0 6px}.glass label:first-child{margin-top:0}
.m{color:var(--m);font-size:.85rem}
h1{font-size:1.5rem;margin:6px 0 14px;letter-spacing:-.02em}
.glass{background:var(--s);border:1px solid var(--b);border-radius:20px;padding:18px;margin-bottom:14px}
.big{font-size:2.4rem;font-weight:800;line-height:1}
.btn{display:block;width:100%;padding:14px 18px;border-radius:14px;background:linear-gradient(135deg,var(--a),var(--a2));color:#08080f;font-weight:700;text-align:center}
.btn.g{background:var(--s);color:var(--t);border:1px solid var(--b);font-weight:600}
.btn.r{background:var(--bad);color:#fff}
.btn:disabled{opacity:.4}
.btn:active{transform:scale(.98)}
.li{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:12px 14px;margin-bottom:8px;border-radius:16px;background:var(--s);border:1px solid var(--b)}
.tx{flex:1;min-width:0}.tx>*{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{font-size:.75rem;padding:3px 10px;border-radius:99px;background:var(--a);color:#08080f;font-weight:700}
.sec{font-size:.8rem;color:var(--m);text-transform:uppercase;letter-spacing:.1em;margin:20px 0 8px}
.prog{height:6px;border-radius:9px;background:var(--b);overflow:hidden;margin-bottom:14px}.prog i{display:block;height:100%;background:var(--a2);transition:width .3s}
.qa{min-height:230px;display:flex;flex-direction:column;justify-content:center;font-size:1.2rem;font-weight:600;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere;cursor:pointer}
.qa hr{border:0;border-top:1px solid var(--b);width:100%;margin:18px 0}
.qa .an{font-weight:400;color:var(--a2)}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rate button{padding:10px 2px;border-radius:14px;background:var(--s);border:1px solid var(--b);font-weight:700;font-size:.9rem}
.rate small{display:block;color:var(--m);font-weight:400;font-size:.72rem}
input,textarea,select{width:100%;padding:12px;border-radius:12px;border:1px solid var(--b);background:var(--s);color:var(--t);font:inherit;margin:6px 0 12px;min-height:44px}
textarea{min-height:150px;resize:vertical}
label{font-size:.82rem;color:var(--m)}
#sh{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:30;display:flex;align-items:flex-end;justify-content:center}
#sIn{width:100%;max-width:640px;max-height:90vh;overflow:auto;padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px));border-radius:24px 24px 0 0;background:var(--bg);border:1px solid var(--b)}
#sIn h3{margin:0 0 10px}
#sIn .btn{margin-top:8px}
.hide{display:none!important}
.cimg{display:block;max-width:100%;max-height:260px;margin:12px auto 0;border-radius:12px;object-fit:contain}
.opt{display:block;width:100%;text-align:left;padding:12px 14px;margin-top:8px;border-radius:14px;background:var(--s);border:1px solid var(--b);overflow-wrap:anywhere}
.opt:disabled{color:var(--t)}.opt.ok{border:2px solid var(--a2)}.opt.no{border:2px dashed var(--bad)}
.selbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;gap:8px;align-items:center;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--b)}
.selbar .btn{margin:0;flex:1}
#toast{position:fixed;left:12px;right:12px;bottom:calc(20px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto;z-index:40;padding:12px 14px;border-radius:14px;background:var(--t);color:var(--bg);text-align:center}
/* ===== redesign v2: wide layout + themes ===== */
html[data-t=ember]{--bg:#150a08;--s:rgba(255,160,100,.07);--b:rgba(255,170,120,.18);--t:#fff1e6;--m:#c9a692;--a:#ff7a45;--a2:#ffd166}

html[data-t=blueprint]{--bg:#08173a;--s:rgba(120,170,255,.08);--b:rgba(150,190,255,.28);--t:#eaf2ff;--m:#9fb6e0;--a:#69a8ff;--a2:#ffffff}
body{font-family:"Avenir Next","SF Pro Rounded",ui-rounded,system-ui,sans-serif;position:relative}
body::before{height:auto;inset:0;opacity:1;background:radial-gradient(50% 40% at 15% 0,rgba(139,124,255,.32),transparent),radial-gradient(45% 40% at 90% 10%,rgba(55,230,200,.2),transparent),radial-gradient(60% 50% at 50% 110%,rgba(139,124,255,.18),transparent)}

main{max-width:1120px;padding:22px 32px 80px;display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px;align-content:start}

.li:hover{border-color:var(--a);transform:translateY(-2px)}
.li b{font-size:1.1rem}
.pill{padding:8px 16px;font-size:.9rem}
.qa{min-height:min(52vh,480px);font-size:clamp(1.4rem,2.8vw,2.2rem);text-align:center;align-items:center}
.qa .an{font-size:.8em}
.cimg{max-height:min(44vh,420px)}

.rate{gap:12px}
.rate button{padding:18px 4px;font-size:1.05rem;border-radius:18px}

.prog{height:8px}
.prog i{background:linear-gradient(90deg,var(--a),var(--a2))}

html[data-t=horizon]{--bg:#02010a;--s:rgba(255,200,150,.05);--b:rgba(255,180,120,.2);--t:#fbf3ff;--m:#b5a6cc;--a:#ff9d4a;--a2:#a98bff}

html[data-t=hyperdrive] .glass,html[data-t=hyperdrive] .li{box-shadow:inset 0 0 30px -18px var(--a),0 0 40px -26px var(--a)}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
main:not(:has(.selbar)) .bar:has(.logo) .row{display:none}
main:has(.logo){padding-bottom:130px}
.li{--h:0}
.li::after{content:attr(data-ini);position:absolute;right:92px;bottom:-22px;font-size:5.6rem;font-weight:900;opacity:.07;pointer-events:none;line-height:1}
.li.z{opacity:.5}
#dock{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:25;display:flex;align-items:center;gap:6px;padding:8px;border-radius:99px;background:color-mix(in srgb,var(--bg) 70%,transparent);border:1px solid var(--b);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);box-shadow:0 10px 40px -10px #000,0 0 40px -18px var(--a)}
#dock button{min-width:52px;height:52px;border-radius:99px;padding:0 16px;font-size:1.2rem;background:transparent;transition:transform .15s,background .15s}
#dock button:active{transform:scale(.9);background:var(--s)}
#dock .go{background:linear-gradient(135deg,var(--a),var(--a2));color:#08080f;font-weight:800;font-size:1rem;padding:0 26px;min-width:150px;box-shadow:0 0 28px -4px var(--a)}
#hint{position:fixed;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));text-align:center;font-size:.85rem;color:var(--m);pointer-events:none;z-index:5}
#swl{position:fixed;z-index:50;pointer-events:none;font-weight:800;font-size:1.6rem;padding:8px 18px;border-radius:99px;background:var(--bg);border:2px solid currentColor;transform:translate(-50%,-50%)}
main.study>.glass:first-of-type{touch-action:none;user-select:none;-webkit-user-select:none;will-change:transform}
.pop{animation:pop .35s cubic-bezier(.2,1.3,.4,1)}
@keyframes pop{from{transform:scale(.9) translateY(18px);opacity:0}}
@media(prefers-reduced-motion:reduce){.pop{animation:none}}
main:not(:has(.selbar)) .bar:has(.logo){display:none}
main>.sec{position:relative}.mini{position:absolute;right:0;top:-10px;min-height:36px;padding:6px 16px;font-size:.85rem;border-radius:99px;background:var(--s);border:1px solid var(--b);color:var(--m);text-transform:none;letter-spacing:0}
.hero{background:none!important;border:0!important;box-shadow:none!important;backdrop-filter:none!important;padding:0!important;text-align:center}
.hero>.big,.hero>.m,.hero>.btn{display:none}
.hw{position:relative;padding:40px 0 26px}
.wm{margin:0;font-size:clamp(4.4rem,11vw,8.4rem);font-weight:900;letter-spacing:-.045em;line-height:1;position:relative;z-index:1;-webkit-user-select:none;user-select:none}
.wm span{display:inline-block;background:linear-gradient(180deg,var(--t) 10%,var(--a) 70%,var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent;animation:wv 3.2s ease-in-out infinite;transition:transform .2s cubic-bezier(.2,1.4,.4,1);filter:drop-shadow(0 0 24px color-mix(in srgb,var(--a) 60%,transparent))}

.ring{position:absolute;left:50%;top:50%;width:min(92%,700px);height:62%;transform:translate(-50%,-50%) rotate(-7deg);border:1px solid var(--b);border-radius:50%;pointer-events:none}
.ox{position:absolute;inset:0}
