<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Recall</title>
<style>
:root{--bg:#0b0b14;--s:rgba(255,255,255,.07);--b:rgba(255,255,255,.14);--t:#f2f1ff;--m:#a7a6c4;--a:#8b7cff;--a2:#37e6c8;--bad:#ff5d7a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html[data-t=ocean]{--bg:#041a24;--t:#e8f8ff;--m:#9bbccc;--a:#3fb6ff;--a2:#6bffb8}
html[data-t=paper]{--bg:#f5f1e8;--s:rgba(0,0,0,.05);--b:rgba(0,0,0,.16);--t:#23201a;--m:#6a6455;--a:#b83c20;--a2:#1f6b5c;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--t);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto 0;height:260px;background:radial-gradient(60% 100% at 50% 0,var(--a),transparent);opacity:.18;pointer-events:none;z-index:-1}
main{max-width:640px;margin:0 auto;padding:14px 16px 60px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;min-height:44px}
:focus-visible{outline:3px solid var(--a2);outline-offset:2px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}
.logo{font-weight:800;font-size:1.4rem;letter-spacing:-.03em;background:linear-gradient(90deg,var(--a),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent}
.chip{background:var(--s);border:1px solid var(--b);border-radius:99px;padding:8px 14px;font-size:.88rem}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip.on{background:var(--a);color:#08080f;border-color:transparent;font-weight:700}
.glass label{display:block;margin:12px 0 6px}.glass label:first-child{margin-top:0}
.m{color:var(--m);font-size:.85rem}
h1{font-size:1.5rem;margin:6px 0 14px;letter-spacing:-.02em}
.glass{background:var(--s);border:1px solid var(--b);border-radius:20px;padding:18px;margin-bottom:14px}
.big{font-size:2.4rem;font-weight:800;line-height:1}
.btn{display:block;width:100%;padding:14px 18px;border-radius:14px;background:linear-gradient(135deg,var(--a),var(--a2));color:#08080f;font-weight:700;text-align:center}
.btn.g{background:var(--s);color:var(--t);border:1px solid var(--b);font-weight:600}
.btn.r{background:var(--bad);color:#fff}
.btn:disabled{opacity:.4}
.btn:active{transform:scale(.98)}
.li{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:12px 14px;margin-bottom:8px;border-radius:16px;background:var(--s);border:1px solid var(--b)}
.tx{flex:1;min-width:0}.tx>*{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{font-size:.75rem;padding:3px 10px;border-radius:99px;background:var(--a);color:#08080f;font-weight:700}
.sec{font-size:.8rem;color:var(--m);text-transform:uppercase;letter-spacing:.1em;margin:20px 0 8px}
.prog{height:6px;border-radius:9px;background:var(--b);overflow:hidden;margin-bottom:14px}.prog i{display:block;height:100%;background:var(--a2);transition:width .3s}
.qa{min-height:230px;display:flex;flex-direction:column;justify-content:center;font-size:1.2rem;font-weight:600;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere;cursor:pointer}
.qa hr{border:0;border-top:1px solid var(--b);width:100%;margin:18px 0}
.qa .an{font-weight:400;color:var(--a2)}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rate button{padding:10px 2px;border-radius:14px;background:var(--s);border:1px solid var(--b);font-weight:700;font-size:.9rem}
.rate small{display:block;color:var(--m);font-weight:400;font-size:.72rem}
input,textarea,select{width:100%;padding:12px;border-radius:12px;border:1px solid var(--b);background:var(--s);color:var(--t);font:inherit;margin:6px 0 12px;min-height:44px}
textarea{min-height:150px;resize:vertical}
label{font-size:.82rem;color:var(--m)}
#sh{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:30;display:flex;align-items:flex-end;justify-content:center}
#sIn{width:100%;max-width:640px;max-height:90vh;overflow:auto;padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px));border-radius:24px 24px 0 0;background:var(--bg);border:1px solid var(--b)}
#sIn h3{margin:0 0 10px}
#sIn .btn{margin-top:8px}
.hide{display:none!important}
.cimg{display:block;max-width:100%;max-height:260px;margin:12px auto 0;border-radius:12px;object-fit:contain}
.opt{display:block;width:100%;text-align:left;padding:12px 14px;margin-top:8px;border-radius:14px;background:var(--s);border:1px solid var(--b);overflow-wrap:anywhere}
.opt:disabled{color:var(--t)}.opt.ok{border:2px solid var(--a2)}.opt.no{border:2px dashed var(--bad)}
.selbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;gap:8px;align-items:center;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--b)}
.selbar .btn{margin:0;flex:1}
#toast{position:fixed;left:12px;right:12px;bottom:calc(20px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto;z-index:40;padding:12px 14px;border-radius:14px;background:var(--t);color:var(--bg);text-align:center}
</style>
</head>
<body>
<main id="app"></main>
<div id="sh" class="hide" role="dialog" aria-modal="true"><div id="sIn"></div></div>
<div id="toast" class="hide" role="status"></div>
<script>
(function(){
'use strict';
var KEY='recall2',S,R={s:null,t:null},ST=null,TT=0,SETV=0,ANA=0,PEND=null,SEL={on:0,ids:{}};
var $=function(q){return document.querySelector(q)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var uid=function(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)};
function sod(t){var d=new Date(t);d.setHours(0,0,0,0);return d.getTime()}
function addDays(t,n){var d=new Date(sod(t));d.setDate(d.getDate()+n);return d.getTime()}
function dk(t){var d=new Date(t);return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
function mk(q,a){return{id:uid(),q:q,a:a,ease:2.5,int:0,reps:0,due:0}}
function toast(m){var t=$('#toast');t.textContent=m;t.className='';clearTimeout(TT);TT=setTimeout(function(){t.className='hide'},3500)}

/* data */
function load(){var raw=null;S=null;
 try{raw=localStorage.getItem(KEY)}catch(e){}
 if(raw){try{S=JSON.parse(raw);if(!S||!Array.isArray(S.subs))S=null}catch(e){S=null}}
 if(!S){S={subs:[],theme:null,days:{}};
  try{var o=JSON.parse(localStorage.getItem('recall1')||'null');if(o&&Array.isArray(o.decks))migrate(o)}catch(e){}
  save()}
 S.days=S.days||{};seed()}
function seed(){if(S.seeded)return;var have={};S.subs.forEach(function(s){have[s.name.toLowerCase()]=1});
 ['Anatomy','Physiology','Biochemistry','Community Medicine','Forensic Medicine','Pathology','Pharmacology','Microbiology','Medicine','Surgery','Obstetrics & Gynaecology','Pediatrics','Orthopaedics','ENT','Ophthalmology','Dermatology','Psychiatry','Anaesthesia','Radiology'].forEach(function(n){if(!have[n.toLowerCase()])S.subs.push({id:uid(),name:n,topics:[]})});
 S.seeded=1;save()}
function migrate(o){var by={};
 o.decks.forEach(function(d){if(!d||d.name==='Welcome tour')return;
  var n=String(d.subj||'General').trim()||'General',s=by[n];
  if(!s){s=by[n]={id:uid(),name:n,topics:[]};S.subs.push(s)}
  s.topics.push({id:uid(),name:String(d.name||'Untitled'),cards:(d.cards||[]).filter(function(c){return c&&c.q!=null}).map(function(c){
   var k=mk(String(c.q),String(c.a==null?'':c.a));k.ease=+c.ease||2.5;k.int=+c.int||0;k.reps=+c.reps||0;k.due=+c.due>1e11?+c.due:0;return k})})})}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Could not save. Storage may be blocked.')}}
function theme(){var t=S.theme||(matchMedia('(prefers-color-scheme: light)').matches?'paper':'aurora');document.documentElement.setAttribute('data-t',t);document.documentElement.style.fontSize=(S.fs||100)+'%'}
function sub(id){return S.subs.filter(function(s){return s.id===id})[0]}
function top(s,id){return s&&s.topics.filter(function(t){return t.id===id})[0]}
function cardsOf(sid,tid){var L=[];S.subs.forEach(function(a){if(sid&&a.id!==sid)return;a.topics.forEach(function(b){if(tid&&b.id!==tid)return;b.cards.forEach(function(c){L.push(c)})})});return L}
function cnt(cs){var n=Date.now(),r={due:0,nw:0,n:cs.length};cs.forEach(function(c){if(!c.reps)r.nw++;else if(c.due<=n)r.due++});return r}
function nlim(){return S.sn||S.nl||20}
function todo(k){return k.due+Math.min(k.nw,S.nl||20)}
function streak(){var s=0,t=Date.now();if(!S.days[dk(t)])t=addDays(t,-1);while(S.days[dk(t)]){s++;t=addDays(t,-1)}return s}

/* scheduling */
function rate(c,r){var n=Date.now(),i=c.int,V=S.iv||{};
 if(r===0){c.ease=Math.max(1.3,c.ease-.2);c.int=0;c.due=n+(V.again||0)*6e4;return}
 if(r===1){i=Math.max(1,Math.round(i*(V.hard||1.2)));c.ease=Math.max(1.3,c.ease-.15)}
 else if(r===2){i=(!c.reps||!i)?(V.good||1):(i===1?3:Math.round(i*c.ease))}
 else{i=(!c.reps||!i)?(V.easy||4):Math.round(i*c.ease*(V.eb||1.3));c.ease+=.15}
 c.int=i;c.reps++;c.due=addDays(n,i)}
function lab(c,r){if(r===0){var m=(S.iv||{}).again||0;return m?(m>=1440?Math.round(m/1440)+'d':m+'m'):'now'}var d=Object.assign({},c);rate(d,r);return d.int>=30?Math.round(d.int/30)+'mo':d.int+'d'}

/* views */
function bar(back,right){return'<div class="bar">'+(back?'<button class="chip" data-a="back">‹ Back</button>':'<span class="logo">Recall</span>')+'<span class="row">'+(right||'')+'</span></div>'}
function ck(id){return SEL.on?'<span style="font-size:1.3rem">'+(SEL.ids[id]?'☑':'☐')+'</span>':''}
function row(a,attrs,name,meta,pill,id){if(SEL.on)return'<button class="li" data-a="pick" data-i="'+id+'">'+ck(id)+'<span class="tx"><b>'+esc(name)+'</b><span class="m">'+meta+'</span></span></button>';return'<div class="li"><button class="tx" data-a="'+a+'" '+attrs+' style="text-align:left;min-height:44px;padding:0"><b>'+esc(name)+'</b><span class="m">'+meta+'</span></button>'+(pill?'<span class="pill">'+pill+'</span>':'')+'<button class="chip on" data-a="st" '+attrs+'>Start</button></div>'}
function selChip(n){return n?'<button class="chip" data-a="sel">'+(SEL.on?'Done':'Select')+'</button>':''}
function selBar(){var n=Object.keys(SEL.ids).length;return'<div class="selbar"><button class="chip" data-a="all">All</button><button class="chip" data-a="none">None</button><button class="btn r" data-a="delsel"'+(n?'':' disabled')+'>Delete'+(n?' ('+n+')':'')+'</button></div><div style="height:90px"></div>'}
function selItems(){return R.t?top(sub(R.s),R.t).cards:R.s?sub(R.s).topics:S.subs}
function studyBtn(k,label){var n=todo(k);if(!n)return'<button class="btn" data-a="study"'+(k.n?'':' disabled')+'>'+(k.n?'Revise all '+k.n+' card'+(k.n>1?'s':''):'No cards yet')+'</button>';return'<button class="btn" data-a="study">Study '+n+' card'+(n>1?'s':'')+'</button>'}
function homeV(){var k=cnt(cardsOf()),t=S.days[dk(Date.now())]||0,st=streak();
 var h=bar(0,selChip(S.subs.length)+'<button class="chip" data-a="ana" aria-label="Analysis">📊</button><button class="chip" data-a="menu" aria-label="Settings">⚙</button>');
 h+='<div class="glass"><div class="big">'+todo(k)+'</div><div class="m" style="margin:6px 0 14px">to study today · '+t+' / '+(S.goal||50)+' done · '+(st?'🔥 '+st+'-day streak':'no streak yet')+'</div>'+studyBtn(k)+'</div>';
 h+='<div class="sec">Subjects</div>';
 if(!S.subs.length)h+='<p class="m">Add your subjects (Anatomy, Physiology…), then add topics inside each one.</p>';
 subsSorted().forEach(function(s){var c=cnt(cardsOf(s.id));h+=row('go','data-s="'+s.id+'"',s.name,s.topics.length+' topics · '+c.n+' cards',c.due?c.due+' due':'',s.id)});
 return h+(SEL.on?selBar():'<button class="btn g" data-a="add" data-k="sub">+ Add subjects</button>')}
function subV(){var s=sub(R.s),k=cnt(cardsOf(s.id));
 var h=bar(1,selChip(s.topics.length)+'<button class="chip" data-a="edit" data-k="sub">Rename</button>')+'<h1>'+esc(s.name)+'</h1>'+studyBtn(k,1)+'<div class="sec">Topics</div>';
 if(!s.topics.length)h+='<p class="m">No topics yet. Add them one per line.</p>';
 s.topics.forEach(function(t){var c=cnt(t.cards);h+=row('go','data-s="'+s.id+'" data-t="'+t.id+'"',t.name,c.n+' cards'+(c.nw?' · '+c.nw+' new':''),c.due?c.due+' due':'',t.id)});
 return h+(SEL.on?selBar():'<button class="btn g" data-a="add" data-k="top">+ Add topics</button>')}
function topicV(){var s=sub(R.s),t=top(s,R.t),k=cnt(t.cards),n=Date.now();
 var h=bar(1,selChip(t.cards.length)+'<button class="chip" data-a="edit" data-k="top">Rename</button>')+'<div class="m">'+esc(s.name)+'</div><h1>'+esc(t.name)+'</h1>'+studyBtn(k,1)+'<div class="sec">'+t.cards.length+' cards</div>';
 t.cards.slice(0,200).forEach(function(c){var st=!c.reps?'new':(c.due<=n?'due now':'next in '+Math.max(1,Math.ceil((c.due-n)/864e5))+'d');
  h+='<button class="li" '+(SEL.on?'data-a="pick" data-i="'+c.id+'">'+ck(c.id):'data-a="ec" data-c="'+c.id+'">')+'<span class="tx"><span>'+(c.qi||c.ai?'🖼 ':'')+esc(c.q)+'</span><span class="m">'+st+'</span></span></button>'});
 if(t.cards.length>200)h+='<p class="m">Showing the first 200 cards.</p>';
 return h+(SEL.on?selBar():'<button class="btn g" data-a="add" data-k="card">+ Add cards</button>')}
function studyV(){var q=ST.q,c=q[ST.i];
 var h=bar(1,'<span class="m">'+Math.min(ST.i+1,q.length)+' / '+q.length+'</span>');
 h=h.replace('‹ Back','‹ End');if(ST.prac)h+='<div class="m" style="margin-bottom:8px">Revision mode · your schedule is not changed</div>';
 if(!c){ST.end=ST.end||Date.now();var sec=Math.max(1,Math.round((ST.end-ST.t0)/1000)),tm=sec>=60?Math.floor(sec/60)+'m '+(sec%60)+'s':sec+'s',NM=['Again','Hard','Good','Easy'],CL=['var(--bad)','#f5a524','var(--a)','var(--a2)'],tot=ST.cnt[0]+ST.cnt[1]+ST.cnt[2]+ST.cnt[3]||1;
  var s2='<div class="glass" style="text-align:center"><div class="big">✓</div><h1 style="margin-bottom:4px">Session done</h1><div class="m">'+ST.done+' cards · '+tm+(ST.prac?' · revision':'')+'</div></div><div class="glass">';
  NM.forEach(function(n,i){s2+='<div style="display:flex;justify-content:space-between;margin-bottom:4px"><span>'+n+'</span><b>'+ST.cnt[i]+'</b></div><div class="prog" style="margin-bottom:12px"><i style="width:'+(ST.cnt[i]/tot*100)+'%;background:'+CL[i]+'"></i></div>'});
  return h+s2+'</div><button class="btn" data-a="back">Finish</button>'}
 h+='<div class="prog"><i style="width:'+(ST.i/q.length*100)+'%"></i></div>';
 var fm=ST.fmt||'flip',mc=fm==='mc'?mcFor(c):null,cz=fm==='cloze'?czFor(c):null,qs='<div style="font-weight:600;font-size:1.15rem;white-space:pre-wrap;overflow-wrap:anywhere">'+esc(c.q)+'</div>'+im(c.qi);
 if(mc){h+='<div class="glass">'+qs;
  mc.opts.forEach(function(o,i){var cl='opt';if(ST.f){if(o===c.a)cl+=' ok';else if(mc.pick===i)cl+=' no'}h+='<button class="'+cl+'" data-a="opt" data-i="'+i+'"'+(ST.f?' disabled':'')+'>'+esc(o)+'</button>'});
  h+='</div>';
  if(!ST.f)return h+'<button class="btn g" data-a="flip">Show answer</button>';
  if(c.ai)h+='<div class="glass">'+im(c.ai)+'</div>';if(mc.pick!=null)h+='<p class="m" style="text-align:center">'+(mc.opts[mc.pick]===c.a?'Correct ✓ Now rate how it felt':'Not quite. Now rate how it felt')+'</p>'}
 else if(cz){h+='<div class="glass">'+qs+'<div style="margin-top:14px;font-size:1.05rem;color:var(--a2);white-space:pre-wrap;overflow-wrap:anywhere">'+esc(cz.masked)+'</div>';
  if(!ST.f)return h+'<input id="cz" autocomplete="off" autocapitalize="off" placeholder="Type the missing part"><button class="btn" data-a="chk">Check</button></div><button class="btn g" data-a="flip">Show answer</button>';
  h+='<hr style="border:0;border-top:1px solid var(--b);margin:14px 0"><div class="an" style="color:var(--a2)">'+esc(c.a)+'</div>'+im(c.ai)+(cz.res!=null?'<div class="m" style="margin-top:8px">'+(cz.res?'Correct ✓':'You typed: '+esc(cz.typed||'(nothing)'))+'</div>':'')+'</div>'}
 else{h+='<div class="glass qa" data-a="flip"><div>'+esc(c.q)+im(c.qi)+'</div>'+(ST.f?'<hr><div class="an">'+esc(c.a)+im(c.ai)+'</div>':'')+'</div>'}
 if(!ST.f)return h+'<button class="btn" data-a="flip">Show answer</button>';
 h+='<div class="rate">';['Again','Hard','Good','Easy'].forEach(function(n,i){h+='<button data-a="rate" data-r="'+i+'">'+n+'<small>'+(ST.prac?'&nbsp;':lab(c,i))+'</small></button>'});
 return h+'</div>'}
function opt(a,v,cur,l){return'<button class="chip'+(cur===v?' on':'')+'" data-a="'+a+'" data-v="'+v+'">'+l+'</button>'}
function setV(){var T=S.theme||(matchMedia('(prefers-color-scheme: light)').matches?'paper':'aurora'),fs=S.fs||100,nl=S.nl||20,g=S.goal||50,nt=0,nc=0;
 S.subs.forEach(function(s){nt+=s.topics.length;s.topics.forEach(function(t){nc+=t.cards.length})});
 var h=bar(1,'')+'<h1>Settings</h1>';
 h+='<div class="sec">Appearance</div><div class="glass"><label>Theme</label><div class="row">'+opt('th','aurora',T,'Aurora')+opt('th','ocean',T,'Ocean')+opt('th','paper',T,'Paper')+'</div><label>Text size</label><div class="row">'+opt('fs',90,fs,'Small')+opt('fs',100,fs,'Normal')+opt('fs',115,fs,'Large')+opt('fs',130,fs,'Huge')+'</div></div>';
 h+='<div class="sec">Study</div><div class="glass"><label>New cards per day</label><div class="row">'+[5,10,20,30,50,100].map(function(n){return opt('nl',n,nl,n)}).join('')+opt('nl',9999,nl,'All')+'</div><label>Daily goal (cards reviewed)</label><div class="row">'+[20,50,100,200].map(function(n){return opt('goal',n,g,n)}).join('')+'</div></div>';
 var V=S.iv||{},D={again:0,hard:1.2,good:1,easy:4,eb:1.3},cv=function(k){return V[k]!=null?V[k]:D[k]},o2=function(k,L){return L.map(function(p){return'<button class="chip'+(cv(k)===p[0]?' on':'')+'" data-a="iv" data-k="'+k+'" data-v="'+p[0]+'">'+p[1]+'</button>'}).join('')};
 h+='<div class="sec">Intervals</div><div class="glass"><label>Again: show again after</label><div class="row">'+o2('again',[[0,'Now'],[1,'1 min'],[10,'10 min'],[30,'30 min'],[1440,'1 day']])+'</div><label>Hard: multiply interval by</label><div class="row">'+o2('hard',[[1,'×1'],[1.2,'×1.2'],[1.5,'×1.5'],[2,'×2']])+'</div><label>Good: first interval</label><div class="row">'+o2('good',[[1,'1 day'],[2,'2 days'],[3,'3 days']])+'</div><label>Easy: first interval</label><div class="row">'+o2('easy',[[3,'3 days'],[4,'4 days'],[7,'7 days']])+'</div><label>Easy bonus (multiplier)</label><div class="row">'+o2('eb',[[1.3,'×1.3'],[1.5,'×1.5'],[2,'×2']])+'</div><p class="m">After the first review, Good grows the gap by each card’s ease. Changes apply to new reviews.</p><button class="chip" data-a="ivr">Reset to defaults</button></div>';
 h+='<div class="sec">Data</div><button class="btn g" data-a="bk">Backup &amp; restore</button><button class="btn g" data-a="seedmore" style="margin-top:8px">Add missing default subjects</button><button class="btn g" data-a="rp" style="margin-top:8px">Reset study progress</button><button class="btn r" data-a="wp" style="margin-top:8px">Delete all data</button>';
 return h+'<p class="m" style="margin-top:18px">'+S.subs.length+' subjects · '+nt+' topics · '+nc+' cards</p>'}
